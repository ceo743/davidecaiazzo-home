		--focus-offset: 2px;
		--focus-width: 2px;
		
		position: fixed;
		bottom: 12px;
		right: 12px;
		height: 24px;
		display: flex;
		align-items: center;
		z-index: 1000000;
		background-color: var(--badge-bg);
		color: var(--badge-text);
		border-radius: var(--badge-radius);
		box-shadow: var(--badge-shadow);
		font-size: 12px;
		font-family: CameraPlainVariable, "CameraPlainVariable Fallback", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
		font-weight: 400 !important;
		text-transform: none !important;
		font-feature-settings: normal !important;
		transform: translateZ(0);
		will-change: transform, opacity;
	}

	#lovable-badge-cta {
		display: flex;
		align-items: center;
		gap: var(--badge-gap);
		padding: 0 var(--badge-padding);
		height: 100%;
		color: inherit;
		text-decoration: none;
		white-space: nowrap;
		border-radius: var(--badge-radius) 0 0 var(--badge-radius);
		transition: 
			background-color var(--badge-transition-duration) ease,
			color var(--badge-transition-duration) ease,
			transform 0.1s ease;
	}

	#lovable-badge-cta:hover {
		background: rgba(255, 255, 255, 0.04);
		color: var(--badge-text-hover);
	}

	#lovable-badge-cta:active {
		transform: scale(0.98);
	}

	#lovable-badge-cta:focus {
		outline: none;
	}

	#lovable-badge-cta:focus-visible {
		outline: var(--focus-width) solid var(--focus-color);
		outline-offset: var(--focus-offset);
		z-index: 1;
	}

	#lovable-badge-text {
		line-height: 1;
	}

	#lovable-badge-divider {
		width: 1px;
		height: 24px;
		background-color: rgba(255, 255, 255, 0.04);
		flex-shrink: 0;
	}

	#lovable-badge-close {
		width: 24px;
		height: 24px;
		min-width: 24px;
		min-height: 24px;
		cursor: pointer;
		background: none;
		border: none;
		padding: 0;
		display: flex;
		align-items: center;
		justify-content: center;
		border-radius: 0 var(--badge-radius) var(--badge-radius) 0;
		flex-shrink: 0;
		transition: 
			background-color var(--badge-transition-duration) ease,
			transform 0.1s ease;
	}

	#lovable-badge-close:hover {
		background: rgba(255, 255, 255, 0.04);
	}

	#lovable-badge-close:active {
		transform: scale(0.92);
	}

	#lovable-badge-close:focus {
		outline: none;
	}

	#lovable-badge-close:focus-visible {
		outline: var(--focus-width) solid var(--focus-color);
		outline-offset: calc(var(--focus-offset) * -1);
		z-index: 1;
	}

	#lovable-badge-close svg path {
		fill: var(--badge-text);
		transition: fill var(--badge-transition-duration) ease;
	}

	#lovable-badge-close:hover svg path {
		fill: var(--badge-text-hover);
	}

	@media (prefers-reduced-motion: reduce) {
		#lovable-badge-cta,
		#lovable-badge-close,
		#lovable-badge-close svg path {
			transition: none;
		}
		
		#lovable-badge-cta:active,
		#lovable-badge-close:active {
			transform: none;
		}
	}

	@media (prefers-contrast: high) {
		#lovable-badge {
			--badge-bg: #000;
			--badge-text: #fff;
			--badge-text-hover: #fff;
			border: 2px solid currentColor;
		}
		
		#lovable-badge-cta:focus-visible,
		#lovable-badge-close:focus-visible {
			outline-width: 3px;
		}
	}
</style>

    + '<span id="dc-lightbox-close" aria-label="Chiudi">&#x2715;</span>'

    + '<div id="dc-lightbox-caption"></div>'
    + '</div>';

  function openLightbox(src, label) {
    var lb = document.getElementById('dc-lightbox');
    lb.querySelector('#dc-lightbox-img').src = src;
    lb.querySelector('#dc-lightbox-img').alt = label;
    lb.querySelector('#dc-lightbox-caption').textContent = label;
    lb.classList.add('dc-lb-open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    var lb = document.getElementById('dc-lightbox');
    lb.classList.remove('dc-lb-open');
    document.body.style.overflow = '';
  }

  function initLightbox() {
    if (document.getElementById('dc-lightbox')) return;
    var div = document.createElement('div');
    div.innerHTML = LIGHTBOX_HTML;
    document.body.appendChild(div.firstElementChild);
    document.getElementById('dc-lightbox').addEventListener('click', function(e) {
      if (e.target === this || e.target.id === 'dc-lightbox-close') closeLightbox();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });
  }

  function inject() {
    if (document.getElementById('dc-palchi-section')) return true; // already injected
    /* Insert Palchi right after the hero video, before the stats section (#credenziali) */
    var insertBefore = document.getElementById('credenziali');
    if (!insertBefore) {
      /* fallback: first sibling after the hero video section (SECTION with no h2, ~816px) */
      var sections = document.querySelectorAll('.min-h-screen > section, #root > div > section');
      for (var i = 0; i < sections.length; i++) {
        if (!sections[i].querySelector('h2') && sections[i].offsetHeight > 300) {
          insertBefore = sections[i].nextElementSibling;
          break;
        }
      }
    }
    if (!insertBefore) return false;
    /* Remove the old stats section (#chi-sono) if still present */
    var chiSono = document.getElementById('chi-sono');
    if (chiSono) chiSono.remove();
    /* Inject styles */
    if (!document.getElementById('dc-eventi-css')) {
      var style = document.createElement('style');
      style.id = 'dc-eventi-css';
      style.textContent = CSS;
      document.head.appendChild(style);
    }
    initLightbox();
    /* Insert Palchi e Istituzioni right after the hero, before stats/books */
    var wrapper = document.createElement('div');
    wrapper.innerHTML = SECTION_HTML;
    var evSection = wrapper.firstElementChild;
    insertBefore.parentNode.insertBefore(evSection, insertBefore);
    /* Attach click listeners */
    document.querySelectorAll('.dc-ev-card[data-img]').forEach(function(card) {
      if (card.getAttribute('aria-hidden') === 'true') return;
      card.addEventListener('click', function() {
        openLightbox(this.getAttribute('data-img'), this.getAttribute('data-label'));
      });
      card.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') openLightbox(this.getAttribute('data-img'), this.getAttribute('data-label'));
      });
    });
    return true;
  }

  /* ── Storie di Successo (Canva embed) injection ─────────────── */
  function injectStorie() {
    if (document.getElementById('dc-storie-section')) return true;
    /* Find the "Articoli Su di Me" section and insert Storie BEFORE it */
    var articoliSection = null;
    document.querySelectorAll('h2').forEach(function(h2) {
      if (h2.textContent.trim() === 'Articoli Su di Me') {
        var el = h2;
        while (el.parentElement && el.parentElement !== document.body) {
          if (el.className && (el.className.indexOf('py-24') !== -1 || el.className.indexOf('grain') !== -1)) break;
          el = el.parentElement;
        }
        articoliSection = el;
      }
    });
    if (!articoliSection) return false;
    var html = '<div id="dc-storie-section" style="background:#060810;padding:clamp(64px,8vw,100px) clamp(20px,4vw,40px)">'
      + '<p style="font-size:11px;text-transform:uppercase;letter-spacing:4px;color:#D4AF37;font-weight:600;margin:0 0 12px;font-family:Inter,sans-serif">Case Study &amp; Risultati</p>'
      + '<h2 style="font-family:\'Playfair Display\',Georgia,serif;font-size:clamp(28px,4vw,46px);font-weight:900;line-height:1.15;margin:0 0 40px;color:#fff">Storie di <em style="background:linear-gradient(135deg,#BF953F 0%,#FCF6BA 25%,#B38728 50%,#FBF5B7 75%,#AA771C 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-style:normal">Successo</em></h2>'
      + '<div style="position:relative;width:100%;height:0;padding-top:56.25%;border-radius:16px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.5)">'
      + '<iframe loading="lazy" style="position:absolute;width:100%;height:100%;top:0;left:0;border:none" src="https://www.canva.com/design/DAF8wilTZ0k/nifhkkukzYPQJybrmkh4Bw/view?embed" allowfullscreen allow="fullscreen"></iframe>'
      + '</div></div>';
    var wrapper = document.createElement('div');
    wrapper.innerHTML = html;
    articoliSection.parentNode.insertBefore(wrapper.firstElementChild, articoliSection);
    return true;
  }

  var observer = new MutationObserver(function() {
    inject();
    injectStorie();
    if (document.getElementById('dc-palchi-section') && document.getElementById('dc-storie-section')) observer.disconnect();
  });
  observer.observe(document.body, {childList:true, subtree:true});
  setTimeout(function() { observer.disconnect(); inject(); injectStorie(); }, 5000);

  /* ── Fix H1 vuota + alt immagini mancanti ── */
  setTimeout(function() {
    // H1: se vuota, aggiunge testo sr-only per SEO senza alterare il layout visivo
    var h1 = document.querySelector('h1');
    if (h1 && !h1.textContent.trim()) {
      var srSpan = document.createElement('span');
      srSpan.style.cssText = 'position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0';
      srSpan.textContent = 'Prima LinkedIn Branding Agency Italiana — Davide Caiazzo';
      h1.appendChild(srSpan);
    }
    // Alt immagini mancanti
    var libri = document.querySelector('img[src*="foto_libri"]');
    if (libri && !libri.alt) libri.alt = 'Il Potere di LinkedIn e I Segreti del Personal Branding — libri di Davide Caiazzo';

    // Hamburger: aggiungi aria-label
    var hamburger = document.querySelector('button.md\\:hidden, nav button:not([id])');
    if (hamburger && !hamburger.getAttribute('aria-label')) hamburger.setAttribute('aria-label', 'Apri menu');

    // Logo link: # → /
    var logoLink = document.querySelector('nav a[href="#"]');
    if (logoLink) logoLink.setAttribute('href', '/');

    // Policy link: aggiungi noopener se manca
    var policyLink = document.querySelector('a[href*="policy"]');
    if (policyLink && !policyLink.rel.includes('noopener')) policyLink.rel = 'noopener noreferrer';

    // Trasparenza link: aggiungi aria-label se testo vuoto
    var trasparenzaLink = document.querySelector('a[href*="trasparenza"]');
    if (trasparenzaLink && !trasparenzaLink.textContent.trim()) {
      trasparenzaLink.setAttribute('aria-label', 'Leggi la pagina Trasparenza');
    }

    // Fix link login → Kajabi
    var loginLink = document.querySelector('a[href*="/login"]');
    if (loginLink) loginLink.setAttribute('href', 'https://app.kajabi.com/users/sign_in');

    // Fix link #chi-sono → #credenziali (sezione reale nella pagina)
    var chiSonoLink = document.querySelector('a[href="#chi-sono"]');
    if (chiSonoLink) chiSonoLink.setAttribute('href', '#credenziali');

    // Fix YouTube → link con sub_confirmation
    var ytLink = document.querySelector('a[href*="youtube.com/@DavideCaiazzo"]');
    if (ytLink) ytLink.setAttribute('href', 'https://www.youtube.com/@DavideCaiazzo?sub_confirmation=1');

    // Card articoli → link a /parlano-di-me
    var h2Articoli = Array.from(document.querySelectorAll('h2')).find(function(h){ return h.textContent.includes('Articoli'); });
    if (h2Articoli) {
      var sezArticoli = h2Articoli.closest('section');
      if (sezArticoli) {
        sezArticoli.querySelectorAll('.rounded-2xl').forEach(function(card) {
          card.style.cursor = 'pointer';
          card.addEventListener('click', function() {
            window.location.href = '/parlano-di-me';
          });
        });
      }
    }
  }, 2000);

  // Smooth scroll per link hash interni (React Router intercetta e blocca la navigazione nativa)
  document.addEventListener('click', function(e) {
    var a = e.target.closest('a[href^="#"]');
    if (!a) return;
    var id = a.getAttribute('href').slice(1);
    var target = document.getElementById(id);
    if (target) {
      e.preventDefault();
      target.scrollIntoView({behavior: 'smooth', block: 'start'});
    }
  }, true);
})();

    '.dc-corso-cd-label{font-family:Inter,sans-serif;font-size:.55rem;text-transform:uppercase;letter-spacing:.15em;color:rgba(252,251,248,.4);margin-top:3px}',
    '.dc-corso-cd-sep{font-family:"Playfair Display",Georgia,serif;font-size:1.3rem;font-weight:900;color:rgba(191,149,63,.5);align-self:flex-start;padding-top:8px}',
    '.dc-corso-urgency{font-family:Inter,sans-serif;font-size:.7rem;color:#ef4444;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}',
    '.dc-corso-btn{display:block;background:'+GOLD+';color:#000;padding:14px 32px;border-radius:10px;font-weight:700;font-size:.9rem;text-decoration:none;transition:opacity .2s;font-family:Inter,sans-serif;margin-bottom:10px;white-space:nowrap}',
    '.dc-corso-btn:hover{opacity:.85}',
    '.dc-corso-garanzia{font-family:Inter,sans-serif;font-size:.7rem;color:rgba(252,251,248,.4);text-align:center}'
  ].join('');

  var sectionHTML = '<div id="dc-corso-section">'
    + '<div class="dc-corso-inner">'
    + '<div class="dc-corso-top-bar"></div>'
    + '<div class="dc-corso-body">'
    + '<div>'
    + '<div class="dc-corso-tag">Corso AI · Agenti Automatici</div>'
    + '<h2 class="dc-corso-title">Automatizza il tuo Lavoro<br>con l\'AI</h2>'
    + '<p class="dc-corso-sub">Smetti di chiedere all\'AI. Fai lavorare l\'AI per te.</p>'
    + '<ul class="dc-corso-features">'
    + '<li>6 moduli pratici da zero</li>'
    + '<li>Nessuna programmazione</li>'
    + '<li>Accesso a vita + aggiornamenti</li>'
    + '<li>Report e chatbot automatici</li>'
    + '<li>Per manager, HR, consulenti</li>'
    + '<li>Garanzia 14 giorni</li>'
    + '</ul>'
    + '</div>'
    + '<div class="dc-corso-cta-box">'
    + '<div class="dc-corso-urgency">⏳ Il prezzo sale il 1° giugno</div>'
    + '<div class="dc-corso-countdown">'
    + '<div class="dc-corso-cd-unit"><span class="dc-corso-cd-num" id="dc-sec-cd-d">3</span><span class="dc-corso-cd-label">giorni</span></div>'
    + '<span class="dc-corso-cd-sep">:</span>'
    + '<div class="dc-corso-cd-unit"><span class="dc-corso-cd-num" id="dc-sec-cd-h">00</span><span class="dc-corso-cd-label">ore</span></div>'
    + '<span class="dc-corso-cd-sep">:</span>'
    + '<div class="dc-corso-cd-unit"><span class="dc-corso-cd-num" id="dc-sec-cd-m">00</span><span class="dc-corso-cd-label">min</span></div>'
    + '</div>'
    + '<div class="dc-corso-price-old">€997</div>'
    + '<div class="dc-corso-price-new">€697</div>'
    + '<div class="dc-corso-price-note">Accesso immediato · dal 1° giugno €997</div>'
    + '<a href="'+CORSO_URL+'" class="dc-corso-btn" target="_blank" rel="noopener">Scopri il Corso →</a>'
    + '<div class="dc-corso-garanzia">✓ Garanzia soddisfatti o rimborsati 14gg</div>'
    + '</div>'

    + '</div>';

  function injectBanner() {
    if (document.getElementById('dc-corso-banner')) return true;
    /* Inserisco subito prima del carosello palchi — primo elemento dopo la hero */
    var anchor = document.getElementById('dc-palchi-section');
    if (!anchor) anchor = document.getElementById('credenziali');
    if (!anchor) return false;
    var style = document.createElement('style');
    style.id = 'dc-corso-banner-css';
    style.textContent = bannerCSS;
    document.head.appendChild(style);
    var wrapper = document.createElement('div');
    wrapper.innerHTML = bannerHTML;
    anchor.parentNode.insertBefore(wrapper.firstElementChild, anchor);
    /* spacer per non coprire il nav */
    var spacer = document.createElement('div');
    spacer.id = 'dc-corso-spacer';
    anchor.parentNode.insertBefore(spacer, anchor);
    /* nav rimane al suo posto */
    updateCountdown();
    setInterval(updateCountdown, 1000);
    return true;
  }

  function injectSection() {
    if (document.getElementById('dc-corso-section')) return true;
    /* Inserisco tra Servizi e Testimonianze */
    var testimonianze = document.getElementById('testimonianze');
    if (!testimonianze) {
      /* fallback: cerca h2 con "Testimonianze" o "Clienti" */
      document.querySelectorAll('h2').forEach(function(h2) {
        if (!testimonianze && (h2.textContent.includes('Testimonianze') || h2.textContent.includes('Clienti'))) {
          var el = h2;
          while (el.parentElement && el.parentElement.tagName !== 'SECTION' && el.parentElement !== document.body) el = el.parentElement;
          testimonianze = el.closest('section') || el.parentElement;
        }
      });
    }
    if (!testimonianze) return false;
    var style = document.createElement('style');
    style.id = 'dc-corso-section-css';
    style.textContent = sectionCSS;
    document.head.appendChild(style);
    var wrapper = document.createElement('div');
    wrapper.innerHTML = sectionHTML;
    testimonianze.parentNode.insertBefore(wrapper.firstElementChild, testimonianze);
    return true;
  }

  var obs = new MutationObserver(function() {
    var b = injectBanner();
    var s = injectSection();
    if (b && s) obs.disconnect();
  });
  obs.observe(document.body, {childList:true, subtree:true});
  setTimeout(function(){ obs.disconnect(); injectBanner(); injectSection(); }, 5000);
})();
</script>
